    let currentLang = 'ALL';
    let currentCat = 'ALL';

    function switchManifesto(lang) {
      const data = manifestos[lang];
      if (!data) return;

      document.getElementById('manifesto-title').textContent = data.title;
      document.getElementById('manifesto-nodes').textContent = data.nodes;
      document.getElementById('manifesto-body').textContent = data.content;

      ['FR', 'DE', 'ES', 'NL', 'EN'].forEach(l => {
        const btn = document.getElementById('tab-btn-' + l);
        if (l === lang) {
          btn.className = 'px-3 py-1 text-xs font-semibold rounded-lg bg-blue-600 text-white transition-all shadow-sm';
        } else {
          btn.className = 'px-3 py-1 text-xs font-semibold rounded-lg bg-[var(--card)] hover:bg-[var(--border)] text-[var(--foreground)] border border-[var(--border)] transition-all';
        }
      });
    }

    function setLangFilter(lang) {
      currentLang = lang;
      document.querySelectorAll('.lang-pill').forEach(el => {
        el.className = 'lang-pill px-3 py-1.5 rounded-lg bg-[var(--background)] hover:bg-[var(--border)] text-[var(--foreground)] border border-[var(--border)] transition-all';
      });
      const activeBtn = document.getElementById('lang-btn-' + lang);
      if (activeBtn) {
        activeBtn.className = 'lang-pill px-3 py-1.5 rounded-lg bg-blue-600 text-white font-semibold transition-all shadow-sm';
      }
      applyFilters();
    }

    function setCatFilter(cat) {
      currentCat = cat;
      document.querySelectorAll('.cat-pill').forEach(el => {
        el.className = 'cat-pill px-3 py-1 rounded-lg bg-[var(--background)] hover:bg-[var(--border)] text-[var(--foreground)] border border-[var(--border)] transition-all';
      });
      let btnId = 'cat-btn-ALL';
      if (cat === '开源协同 Etherpad') btnId = 'cat-btn-pad';
      else if (cat === '顶级开发者生态') btnId = 'cat-btn-dev';
      else if (cat === '去中心化与抗审查') btnId = 'cat-btn-decent';
      else if (cat === '极客代码与分发') btnId = 'cat-btn-paste';
      else if (cat === '独立博客与出版') btnId = 'cat-btn-blog';
      else if (cat === '全球社交与论坛') btnId = 'cat-btn-social';

      const activeBtn = document.getElementById(btnId);
      if (activeBtn) {
        activeBtn.className = 'cat-pill px-3 py-1 rounded-lg bg-slate-800 dark:bg-slate-200 text-white dark:text-slate-900 font-semibold transition-all shadow-sm';
      }
      applyFilters();
    }

    function renderGrid(items) {
      const grid = document.getElementById('platforms-grid');
      const noResults = document.getElementById('no-results');
      document.getElementById('filtered-count').textContent = items.length;

      if (items.length === 0) {
        grid.innerHTML = '';
        noResults.classList.remove('hidden');
        return;
      }
      noResults.classList.add('hidden');

      grid.innerHTML = items.map(p => {
        const isPad = p.category.includes('Etherpad');
        const isDev = p.category.includes('开发者');
        const isDecent = p.category.includes('去中心化');
        
        let catBadgeColor = 'bg-slate-500/10 text-slate-600 dark:text-slate-400 border-slate-500/20';
        if (isPad) catBadgeColor = 'bg-amber-500/10 text-amber-600 dark:text-amber-400 border-amber-500/20';
        else if (isDev) catBadgeColor = 'bg-blue-500/10 text-blue-600 dark:text-blue-400 border-blue-500/20';
        else if (isDecent) catBadgeColor = 'bg-purple-500/10 text-purple-600 dark:text-purple-400 border-purple-500/20';

        return `
          <div class="group relative flex flex-col justify-between p-4 rounded-xl bg-[var(--card)] border border-[var(--border)] hover:border-blue-500/40 hover:shadow-lg transition-all duration-200">
            <div>
              <div class="flex items-start justify-between gap-2 mb-2">
                <div class="flex items-center gap-2">
                  <span class="inline-flex items-center justify-center w-7 h-7 rounded-lg bg-[var(--background)] border border-[var(--border)] text-xs font-bold text-[var(--muted-foreground)]">
                    #${p.id}
                  </span>
                  <h4 class="font-bold text-sm text-[var(--foreground)] group-hover:text-blue-500 transition-colors line-clamp-1" title="${p.name}">
                    ${p.name}
                  </h4>
                </div>
                <span class="inline-flex items-center gap-1 text-[11px] font-semibold text-emerald-500 bg-emerald-500/10 px-2 py-0.5 rounded-full whitespace-nowrap">
                  <span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span> 200 OK
                </span>
              </div>

              <div class="flex flex-wrap items-center gap-1.5 my-2">
                <span class="text-[11px] px-2 py-0.5 rounded-md font-medium border ${catBadgeColor}">
                  ${p.category}
                </span>
                <span class="text-[11px] px-2 py-0.5 rounded-md font-medium bg-[var(--background)] border border-[var(--border)] text-[var(--foreground)]">
                  ${p.langLabel}
                </span>
                <span class="text-[11px] px-2 py-0.5 rounded-md font-medium bg-blue-500/5 text-blue-500 border border-blue-500/10">
                  ${p.method}
                </span>
              </div>

              <p class="text-xs text-[var(--muted-foreground)] line-clamp-2 my-2 leading-relaxed">
                ${p.desc}
              </p>
            </div>

            <div class="pt-3 mt-1 border-t border-[var(--border)]/60 flex items-center justify-between gap-2">
              <a 
                href="${p.url}" 
                target="_blank" 
                rel="noopener noreferrer" 
                class="inline-flex items-center gap-1 text-xs font-semibold text-blue-500 hover:text-blue-600 dark:hover:text-blue-400 hover:underline transition-all"
              >
                <span>直达官方落地页</span>
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path>
                </svg>
              </a>
              <button 
                onclick="copyUrl('${p.url}', this)" 
                class="text-[11px] text-[var(--muted-foreground)] hover:text-[var(--foreground)] px-2 py-1 rounded bg-[var(--background)] border border-[var(--border)] transition-all"
              >
                复制链接
              </button>
            </div>
          </div>
        `;
      }).join('');
    }

    function applyFilters() {
      const query = document.getElementById('search-input').value.trim().toLowerCase();
      
      const filtered = platforms.filter(p => {
        const matchesQuery = !query || 
          p.name.toLowerCase().includes(query) ||
          p.desc.toLowerCase().includes(query) ||
          p.category.toLowerCase().includes(query) ||
          p.langLabel.toLowerCase().includes(query) ||
          p.method.toLowerCase().includes(query) ||
          p.url.toLowerCase().includes(query);

        const matchesLang = currentLang === 'ALL' || p.lang === currentLang;
        const matchesCat = currentCat === 'ALL' || p.category === currentCat;

        return matchesQuery && matchesLang && matchesCat;
      });

      renderGrid(filtered);
    }

    function copyUrl(url, btn) {
      navigator.clipboard.writeText(url).then(() => {
        const originalText = btn.textContent;
        btn.textContent = '已复制!';
        btn.classList.add('text-emerald-500');
        setTimeout(() => {
          btn.textContent = originalText;
          btn.classList.remove('text-emerald-500');
        }, 1500);
      }).catch(() => {
        prompt("请复制以下链接:", url);
      });
    }

    switchManifesto('FR');
    renderGrid(platforms);
  </script>
